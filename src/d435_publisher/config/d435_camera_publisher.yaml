d435_camera_publisher:
  ros__parameters:
    # MuJoCo scene XML路径。支持绝对路径、相对路径和package://包名/相对路径。
    model_path: "package://robot_description/S4/mjcf/scene_S4.xml"

    # MuJoCo模型中的固定相机名称。
    camera_name: "d435_camera"

    # ROS图像参数。
    frame_id: "d435_camera"
    image_topic: "/camera/color/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    enable_depth: true
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    width: 640
    height: 480
    fps: 30.0

    # 主 MuJoCo 仿真发布的完整 qpos。收到后，相机使用同一状态渲染而非停留在 home。
    qpos_topic: "/mujoco/qpos"

    # 在收到第一帧 qpos 前，是否先加载 home keyframe。
    reset_to_home: true
